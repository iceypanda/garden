        <h1>Corgette</h1>

        <h2>Care</h2>
        <ul>
            <li>Protect from frost</li>
            <li>Never water over plants</li>
            <li>Keep soil moist around plant</li>
            <li>Feed with each watering when fruiting</li>
        </ul>

        <h2>Planting</h2>
        <ul>
            <li>Sunny, sheltered position</li>
        </ul>

        <h2>Harvest</h2>
        <ul>
            <li>July to October</li>
            <li>Harvest regularly to prolong cropping</li>
        </ul>
